[Configurations]
configs: gnu
[gnu]
brief: Portable GNU/OpenMPI TELEMAC2D build, no architecture-specific patch
root: /opt/telemac
version: v8p5
language: 2
modules: telemac2d partel gretel
options:
cmd_obj: mpif90 -c -O2 -fPIC -cpp -DHAVE_MPI -DHAVE_I16 -fconvert=big-endian -frecord-marker=4 <mods> <incs> <f95name>
cmd_obj_c: gcc -c -O2 -fPIC <srcName> -o <objName>
cmd_lib: ar cr <libname> <objs>
cmd_exe: mpif90 -o <exename> <objs> <libs>
mods_all: -I <config>
incs_all: -I/usr/include
libs_all: -lmetis
mpi_cmdexec: mpirun -np <ncsize> <exename>
sfx_zip: .gztar
sfx_obj: .o
sfx_mod: .mod
sfx_lib: .a
sfx_exe:

name: Tests
on: [push, pull_request]
defaults:
  run:
    working-directory: telemac_workspace/tapajos-telemac-platform
jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: pip install -r requirements.txt
      - run: pytest -q
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: telemac_workspace/tapajos-telemac-platform/frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
